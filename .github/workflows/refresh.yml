# Weekly data refresh (Jorge, Nov 11, 2026): free Actions in this public repo.
# Pulls Jorge's data at each repo's latest commit, rebuilds the prompts and
# relocks only days not yet played. Today and tomorrow (by the 9:00 AM ET
# day) and every past day are frozen byte for byte (scripts/build.mjs).
# Commits to main only if something changed; the Pages workflow publishes.
name: Weekly data refresh
on:
  schedule:
    - cron: '41 6 * * 1'   # Mondays 06:41 UTC, before the 9:00 AM ET reset
  workflow_dispatch:
permissions:
  contents: write
  actions: write   # to start the Pages workflow
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/pull-data.mjs --latest
      - run: node scripts/generate-prompts.mjs > /dev/null
      # Headshot sources for new players (NBA.com and Jorge's sites; cached in data/headshots.json).
      - run: node scripts/headshots.mjs
      - run: node scripts/build.mjs
      # Preview cards for days that have none yet (headless Chromium).
      - run: npm install --no-save --no-package-lock playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node scripts/cards.mjs
      - run: node --test test/*.test.mjs
      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain -- data public docs)" ]; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data public docs
          git commit -m "Weekly data refresh: $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
      # A push made with GITHUB_TOKEN does not start other workflows, so
      # publish here.
      - name: Publish
        if: always()
        run: gh workflow run pages.yml --ref main || true
        env:
          GH_TOKEN: ${{ github.token }}
